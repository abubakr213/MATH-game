
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Games — Вход</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container">

        <div class="logo">
            <div class="logo-icon">M</div>
            <h1>Math Games</h1>
            <p>Математика может быть интересной!</p>
        </div>

        <div class="login-card">

            <div class="tabs" id="authTabs">
                <button class="tab active" id="loginTab">Вход</button>
                <button class="tab" id="registerTab">Регистрация</button>
            </div>

            <form id="loginForm">
                <h2>С возвращением!</h2>
                <p>Войдите в свой аккаунт</p>

                <label>Имя пользователя</label>
                <input type="text" id="loginUsername"
                    placeholder="Введите имя пользователя" required>

                <label>Пароль</label>
                <input type="password" id="loginPassword"
                    placeholder="Введите пароль" required>

                <button type="submit" class="main-button">Войти</button>

                <div id="loginMessage"></div>

                <button type="button" class="forgot-link" id="forgotBtn">
                    Забыли пароль?
                </button>
            </form>

            <form id="registerForm" class="hidden">
                <h2>Создать аккаунт</h2>
                <p>Присоединяйтесь к Math Games</p>

                <label>Имя пользователя</label>
                <input type="text" id="registerUsername"
                    placeholder="Придумайте имя пользователя"
                    required minlength="3">

                <label>Пароль</label>
                <input type="password" id="registerPassword"
                    placeholder="Придумайте пароль"
                    required minlength="8">

                <label>Повторите пароль</label>
                <input type="password" id="repeatPassword"
                    placeholder="Повторите пароль"
                    required minlength="8">

                <button type="submit" class="main-button">
                    Создать аккаунт
                </button>

                <div id="registerMessage"></div>
            </form>

            <form id="recoveryForm" class="hidden">
                <h2>Восстановление пароля</h2>
                <p>Подтвердите данные своего аккаунта</p>

                <label>Имя пользователя</label>
                <input type="text" id="recoveryUsername"
                    placeholder="Введите имя пользователя" required>

                <label>Количество золотых монет</label>
                <input type="number" id="recoveryGold"
                    placeholder="Например: 250" required min="0">

                <label>Уровень аккаунта</label>
                <input type="number" id="recoveryLevel"
                    placeholder="Например: 5" required min="1">

                <label>Количество XP</label>
                <input type="number" id="recoveryXP"
                    placeholder="Например: 120" required min="0">

                <button type="submit" class="main-button">
                    Проверить данные
                </button>

                <div id="recoveryMessage"></div>
            </form>

            <form id="newPasswordForm" class="hidden">
                <h2>Новый пароль</h2>
                <p>Придумайте новый пароль для аккаунта</p>

                <label>Новый пароль</label>
                <input type="password" id="newPassword"
                    placeholder="Введите новый пароль"
                    required minlength="8">

                <label>Повторите новый пароль</label>
                <input type="password" id="repeatNewPassword"
                    placeholder="Повторите новый пароль"
                    required minlength="8">

                <button type="submit" class="main-button">
                    Сохранить пароль
                </button>

                <div id="newPasswordMessage"></div>
            </form>

            <button type="button" id="backToLogin" class="forgot-link hidden">
                Вернуться ко входу
            </button>

        </div>

        <footer>© 2026 Math Games</footer>

    </div>

    <script src="login.js"></script>
</body>
</html>
